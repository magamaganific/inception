services:
  mariadb:
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./requirements/mariadb/conf/my.cnf:etc/mysql/my.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - mfornovinet
    env_file:
      - .env
      - ./secrets/.secrets
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - mfornovinet
    env_file:
      - .env
      - ./secrets/.secrets
    depends_on:
      - mariadb
    restart: always
  
  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx
    image: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - mfornovinet
    depends_on:
      - wordpress
    restart: always

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      device: /home/mfornovi/data/MD
      o: bind

  wordpress_files:
    name: wordpress_files
    driver: local
    driver_opts:
      type: none
      device: /home/mfornovi/data/WP
      o: bind
    
networks:
  mfornovinet:
    driver: bridge
